<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Inventori Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .navbar h1 {
      font-size: 28px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .card-icon.total {
      color: #667eea;
    }

    .card-icon.aset {
      color: #f093fb;
    }

    .card-icon.stok {
      color: #4facfe;
    }

    .card-icon.kritis {
      color: #fa709a;
    }

    .card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }

    .controls {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: 2px solid #f0f0f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .search-box i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 16px;
      border: 2px solid #f0f0f0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s ease;
    }

    .filter-btn.active,
    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
      background: rgba(102, 126, 234, 0.05);
    }

    .table-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    th {
      padding: 18px 20px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    tbody tr {
      transition: all 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(102, 126, 234, 0.05);
    }

    tbody tr.low-stock {
      background: #fff3f5;
    }

    tbody tr.low-stock:hover {
      background: #ffe8ed;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-kritis {
      background: #fa709a;
      color: white;
    }

    .badge-rendah {
      background: #ffa502;
      color: white;
    }

    .badge-normal {
      background: #26de81;
      color: white;
    }

    .badge-habis {
      background: #c44569;
      color: white;
    }

    .price {
      font-weight: 600;
      color: #667eea;
    }

    .stok-col {
      font-weight: 600;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #667eea;
      padding: 5px 10px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: rgba(102, 126, 234, 0.1);
      color: #764ba2;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state i {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #f0f0f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 25px;
    }

    .footer {
      text-align: center;
      color: white;
      padding: 20px;
      margin-top: 30px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 15px 20px;
      }

      .navbar h1 {
        font-size: 20px;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        min-width: auto;
      }

      .filter-group {
        width: 100%;
      }

      th, td {
        padding: 12px 10px;
        font-size: 12px;
      }

      .dashboard {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .card-value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <h1><i class="fas fa-boxes"></i> Inventory Pro</h1>
    <div class="navbar-actions">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Tambah Produk
      </button>
      <button class="btn btn-secondary" onclick="downloadReport()">
        <i class="fas fa-download"></i> Export
      </button>
    </div>
  </div>

  <div class="container">
    <!-- Dashboard Cards -->
    <div class="dashboard">
      <div class="card">
        <div class="card-icon total"><i class="fas fa-list"></i></div>
        <h3>Total Produk</h3>
        <div class="card-value" id="totalJenis">0</div>
      </div>
      <div class="card">
        <div class="card-icon aset"><i class="fas fa-money-bill-wave"></i></div>
        <h3>Total Aset</h3>
        <div class="card-value" id="totalAset">Rp 0</div>
      </div>
      <div class="card">
        <div class="card-icon stok"><i class="fas fa-warehouse"></i></div>
        <h3>Total Stok</h3>
        <div class="card-value" id="totalStok">0</div>
      </div>
      <div class="card">
        <div class="card-icon kritis"><i class="fas fa-exclamation-circle"></i></div>
        <h3>Stok Kritis</h3>
        <div class="card-value" id="stokKritis">0</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari produk..." onkeyup="filterProducts()">
        <i class="fas fa-search"></i>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="filterByCategory('semua')">Semua</button>
        <button class="filter-btn" onclick="filterByCategory('Elektronik')">Elektronik</button>
        <button class="filter-btn" onclick="filterByCategory('Aksesoris')">Aksesoris</button>
        <button class="filter-btn" onclick="filterByCategory('Penyimpanan')">Penyimpanan</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Produk</th>
            <th>Kategori</th>
            <th>Harga Unit</th>
            <th>Stok</th>
            <th>Status</th>
            <th>Subtotal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr>
            <td colspan="8" class="empty-state">
              <i class="fas fa-inbox"></i>
              <p>Tidak ada produk. Tambahkan produk baru untuk memulai.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah/Edit Produk -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Tambah Produk Baru</span>
      </div>
      <form id="productForm">
        <div class="form-group">
          <label>ID Produk</label>
          <input type="text" id="formId" placeholder="PRD-001" required>
        </div>
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="formNama" placeholder="Masukkan nama produk" required>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="formKategori" required>
            <option value="">Pilih kategori</option>
            <option value="Elektronik">Elektronik</option>
            <option value="Aksesoris">Aksesoris</option>
            <option value="Penyimpanan">Penyimpanan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label>Harga Unit (Rp)</label>
          <input type="number" id="formHarga" placeholder="Masukkan harga" required>
        </div>
        <div class="form-group">
          <label>Stok</label>
          <input type="number" id="formStok" placeholder="Masukkan jumlah stok" required>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="formDeskripsi" placeholder="Masukkan deskripsi produk" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2024 Inventory Pro System. Sistem Manajemen Inventori Modern.</p>
  </div>

  <script>
    let products = [
      {
        id: "PRD-001",
        nama: "Laptop Asus Vivobook",
        kategori: "Elektronik",
        harga: 8500000,
        stok: 5,
        deskripsi: "Laptop produktivitas harian dengan layar FHD 14 inci."
      },
      {
        id: "PRD-002",
        nama: "Mouse Wireless Logitech",
        kategori: "Aksesoris",
        harga: 150000,
        stok: 2,
        deskripsi: "Mouse nirkabel ergonomis dengan ketahanan baterai tinggi."
      },
      {
        id: "PRD-003",
        nama: "Keyboard Mekanikal Keychron",
        kategori: "Aksesoris",
        harga: 1200000,
        stok: 8,
        deskripsi: "Keyboard mekanikal RGB dengan switch hotswap."
      },
      {
        id: "PRD-004",
        nama: "Monitor LG 24 Inci 144Hz",
        kategori: "Elektronik",
        harga: 2100000,
        stok: 1,
        deskripsi: "Monitor gaming IPS Full HD dengan refresh rate 144Hz."
      },
      {
        id: "PRD-005",
        nama: "Flashdisk SanDisk 64GB",
        kategori: "Penyimpanan",
        harga: 85000,
        stok: 0,
        deskripsi: "Flashdisk USB 3.0 dengan kecepatan transfer cepat."
      }
    ];

    let filteredProducts = [...products];
    let currentFilter = 'semua';

    function rupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    function getStatusBadge(stok) {
      if (stok === 0) {
        return '<span class="status-badge badge-habis"><i class="fas fa-times-circle"></i> Habis</span>';
      } else if (stok <= 2) {
        return '<span class="status-badge badge-kritis"><i class="fas fa-exclamation-circle"></i> Kritis</span>';
      } else if (stok <= 5) {
        return '<span class="status-badge badge-rendah"><i class="fas fa-info-circle"></i> Rendah</span>';
      } else {
        return '<span class="status-badge badge-normal"><i class="fas fa-check-circle"></i> Normal</span>';
      }
    }

    function updateDashboard() {
      const totalProduk = products.length;
      const totalAset = products.reduce((total, p) => total + (p.harga * p.stok), 0);
      const totalStok = products.reduce((total, p) => total + p.stok, 0);
      const stokKritis = products.filter(p => p.stok <= 2).length;

      document.getElementById('totalJenis').textContent = totalProduk;
      document.getElementById('totalAset').textContent = rupiah(totalAset);
      document.getElementById('totalStok').textContent = totalStok;
      document.getElementById('stokKritis').textContent = stokKritis;
    }

    function renderTable() {
      const table = document.getElementById('productTable');

      if (filteredProducts.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="8" class="empty-state">
              <i class="fas fa-search"></i>
              <p>Tidak ada produk yang sesuai dengan filter.</p>
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = filteredProducts.map(product => {
        const subtotal = product.harga * product.stok;
        const lowStock = product.stok <= 2;

        return `
          <tr class="${lowStock ? 'low-stock' : ''}">
            <td><strong>${product.id}</strong></td>
            <td>${product.nama}</td>
            <td>${product.kategori}</td>
            <td class="price">${rupiah(product.harga)}</td>
            <td class="stok-col">${product.stok} unit</td>
            <td>${getStatusBadge(product.stok)}</td>
            <td class="price">${rupiah(subtotal)}</td>
            <td>
              <button class="action-btn" onclick="editProduct('${product.id}')" title="Edit">
                <i class="fas fa-edit"></i>
              </button>
              <button class="action-btn" onclick="deleteProduct('${product.id}')" title="Hapus">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function filterProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      filteredProducts = products.filter(p =>
        (currentFilter === 'semua' || p.kategori === currentFilter) &&
        (p.nama.toLowerCase().includes(search) ||
         p.id.toLowerCase().includes(search) ||
         p.deskripsi.toLowerCase().includes(search))
      );
      renderTable();
    }

    function filterByCategory(category) {
      currentFilter = category.toLowerCase();
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      filterProducts();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Tambah Produk Baru';
      document.getElementById('productForm').reset();
      document.getElementById('productForm').onsubmit = saveProduct;
      document.getElementById('productModal').classList.add('active');
    }

    function editProduct(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      document.getElementById('modalTitle').textContent = 'Edit Produk';
      document.getElementById('formId').value = product.id;
      document.getElementById('formId').disabled = true;
      document.getElementById('formNama').value = product.nama;
      document.getElementById('formKategori').value = product.kategori;
      document.getElementById('formHarga').value = product.harga;
      document.getElementById('formStok').value = product.stok;
      document.getElementById('formDeskripsi').value = product.deskripsi;

      document.getElementById('productForm').onsubmit = function(e) {
        e.preventDefault();
        updateProduct(id);
      };

      document.getElementById('productModal').classList.add('active');
    }

    function deleteProduct(id) {
      if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
        products = products.filter(p => p.id !== id);
        filterProducts();
        updateDashboard();
      }
    }

    function saveProduct(e) {
      e.preventDefault();
      const newProduct = {
        id: document.getElementById('formId').value,
        nama: document.getElementById('formNama').value,
        kategori: document.getElementById('formKategori').value,
        harga: parseInt(document.getElementById('formHarga').value),
        stok: parseInt(document.getElementById('formStok').value),
        deskripsi: document.getElementById('formDeskripsi').value
      };

      if (products.find(p => p.id === newProduct.id)) {
        alert('ID Produk sudah ada!');
        return;
      }

      products.push(newProduct);
      filterProducts();
      updateDashboard();
      closeModal();
    }

    function updateProduct(id) {
      const index = products.findIndex(p => p.id === id);
      if (index === -1) return;

      products[index] = {
        id: id,
        nama: document.getElementById('formNama').value,
        kategori: document.getElementById('formKategori').value,
        harga: parseInt(document.getElementById('formHarga').value),
        stok: parseInt(document.getElementById('formStok').value),
        deskripsi: document.getElementById('formDeskripsi').value
      };

      filterProducts();
      updateDashboard();
      closeModal();
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
      document.getElementById('formId').disabled = false;
    }

    function downloadReport() {
      let csv = 'ID,Nama Produk,Kategori,Harga Unit,Stok,Subtotal\n';
      products.forEach(p => {
        csv += `${p.id},"${p.nama}",${p.kategori},${p.harga},${p.stok},${p.harga * p.stok}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'inventory_report.csv';
      a.click();
    }

    // Initial load
    updateDashboard();
    renderTable();
  </script>
</body>
</html>
